name: macOS arm64 local test build

# Local-only helper: builds an unsigned aarch64-apple-darwin .app from this
# branch so the loopback-proxy fix can be tried on a real Mac. Not a PR
# pipeline — it never runs on pull_request and never touches a release.
on:
  push:
    branches:
      - build/macos-arm64-local
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned .app (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      MATRIX_TARGET: aarch64-apple-darwin
      PROFILE: release
    steps:
      - name: Checkout build ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
          cache: true

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: bash scripts/ci-cancel-aware.sh pnpm install --frozen-lockfile

      - name: Bundle pinned native modules
        run: node scripts/release/stage-modules.mjs --target "$MATRIX_TARGET"

      - name: Build and package Tauri app
        shell: bash
        working-directory: app
        env:
          BASE_URL: https://api.tinyhumans.ai/
          OPENHUMAN_APP_ENV: production
          VITE_OPENHUMAN_APP_ENV: production
          VITE_BACKEND_URL: https://api.tinyhumans.ai/
          VITE_BUILD_SHA: ${{ github.sha }}
          OPENHUMAN_BUILD_SHA: ${{ github.sha }}
          SENTRY_RELEASE: openhuman@0.64.18-local+${{ github.sha }}
          MACOSX_DEPLOYMENT_TARGET: 12.3
          WITH_UPDATER: 'false'
        run: |
          NODE_OPTIONS="--max-old-space-size=8192" bash ../scripts/ci-cancel-aware.sh \
            pnpm tauri build --target "$MATRIX_TARGET" --bundles app

      - name: Locate macOS .app bundle
        id: locate-app
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            "crates/openhuman-app/target/${MATRIX_TARGET}/${PROFILE}/bundle/macos/OpenHuman.app" \
            "target/${MATRIX_TARGET}/${PROFILE}/bundle/macos/OpenHuman.app"; do
            if [ -d "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          APP_PATH="$(find . -path "*/${PROFILE}/bundle/macos/OpenHuman.app" -type d 2>/dev/null | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find OpenHuman.app bundle"
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign the bundle
        # No Apple Developer identity here, so the bundle is signed ad-hoc.
        # Gatekeeper still blocks it on first launch; the tester removes the
        # quarantine flag locally.
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "${{ steps.locate-app.outputs.path }}"
          codesign --verify --deep --strict "${{ steps.locate-app.outputs.path }}" || true

      - name: Upload .app artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenHuman-aarch64-apple-darwin-local
          path: ${{ steps.locate-app.outputs.path }}
          retention-days: 14
          if-no-files-found: error
